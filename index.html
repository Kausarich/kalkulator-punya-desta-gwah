<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Desta Calculator - Black & White Brutalism</title>
    <!-- Google Fonts: Space Mono & JetBrains Mono -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500;700;800&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #ffffff;
            --text: #000000;
            --card-bg: #ffffff;
            --border: #000000;
            --border-width: 3px;
            --shadow: 4px 4px 0px #000000;
            --shadow-lg: 6px 6px 0px #000000;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Space Mono', 'JetBrains Mono', monospace;
        }

        body {
            background-color: var(--bg);
            background-image: radial-gradient(#000000 1px, transparent 1px);
            background-size: 20px 20px;
            color: var(--text);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 2.5rem 1rem;
        }

        /* Header */
        .header {
            text-align: center;
            margin-bottom: 2rem;
            border: var(--border-width) solid var(--border);
            background: #ffffff;
            padding: 1.5rem 2rem;
            box-shadow: var(--shadow-lg);
        }

        .header h1 {
            font-size: 2.2rem;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: -1px;
            margin-bottom: 0.25rem;
        }

        .header p {
            font-size: 0.9rem;
            font-weight: 700;
            text-transform: uppercase;
            color: #444444;
        }

        /* Nav Tabs */
        .tabs {
            display: flex;
            gap: 0.75rem;
            margin-bottom: 2rem;
        }

        .tab-btn {
            background: #ffffff;
            border: var(--border-width) solid var(--border);
            color: var(--text);
            padding: 0.75rem 1.5rem;
            font-size: 0.95rem;
            font-weight: 700;
            text-transform: uppercase;
            cursor: pointer;
            box-shadow: var(--shadow);
            transition: all 0.15s ease;
        }

        .tab-btn.active {
            background: #000000;
            color: #ffffff;
            transform: translate(2px, 2px);
            box-shadow: 2px 2px 0px #000000;
        }

        .tab-btn:hover:not(.active) {
            background: #000000;
            color: #ffffff;
        }

        /* Main Container Card */
        .app-container {
            width: 100%;
            max-width: 850px;
            background: var(--card-bg);
            border: var(--border-width) solid var(--border);
            padding: 2rem;
            box-shadow: var(--shadow-lg);
        }

        .tab-content {
            display: none;
        }

        .tab-content.active {
            display: block;
        }

        .section-title {
            font-size: 1.3rem;
            font-weight: 800;
            text-transform: uppercase;
            margin-bottom: 1.25rem;
            padding-bottom: 0.5rem;
            border-bottom: var(--border-width) solid var(--border);
        }

        /* Tab 1: Calculator */
        .calc-display {
            background: #ffffff;
            border: var(--border-width) solid var(--border);
            padding: 1.25rem;
            text-align: right;
            margin-bottom: 1.5rem;
            box-shadow: var(--shadow);
        }

        .calc-expr {
            font-size: 1.1rem;
            color: #555555;
            min-height: 1.5rem;
            word-break: break-all;
            font-weight: 700;
        }

        .calc-result {
            font-size: 2.5rem;
            font-weight: 800;
            color: #000000;
            margin-top: 0.25rem;
        }

        .calc-grid {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 0.75rem;
        }

        .calc-btn {
            background: #ffffff;
            border: var(--border-width) solid var(--border);
            color: var(--text);
            font-size: 1.25rem;
            font-weight: 700;
            padding: 1.1rem 0;
            cursor: pointer;
            box-shadow: var(--shadow);
            transition: all 0.1s ease;
        }

        .calc-btn:hover {
            background: #000000;
            color: #ffffff;
        }

        .calc-btn:active {
            transform: translate(2px, 2px);
            box-shadow: 2px 2px 0px #000000;
        }

        .calc-btn.op {
            background: #e0e0e0;
        }

        .calc-btn.action {
            background: #000000;
            color: #ffffff;
        }

        .calc-btn.action:hover {
            background: #ffffff;
            color: #000000;
        }

        .calc-btn.equals {
            background: #000000;
            color: #ffffff;
            font-weight: 800;
        }

        /* Form Controls */
        .form-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 1.25rem;
            margin-bottom: 1.5rem;
        }

        .form-grid-2col {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1.25rem;
            margin-bottom: 1.5rem;
        }

        .input-group {
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
        }

        .input-group label {
            font-size: 0.85rem;
            font-weight: 700;
            text-transform: uppercase;
        }

        .input-control {
            background: #ffffff;
            border: var(--border-width) solid var(--border);
            color: #000000;
            padding: 0.75rem 1rem;
            font-size: 1rem;
            font-weight: 700;
            outline: none;
            box-shadow: var(--shadow);
        }

        .input-control:focus {
            background: #f0f0f0;
        }

        .primary-btn {
            background: #000000;
            color: #ffffff;
            border: var(--border-width) solid var(--border);
            padding: 0.85rem 1.75rem;
            font-size: 0.95rem;
            font-weight: 800;
            text-transform: uppercase;
            cursor: pointer;
            box-shadow: var(--shadow);
            transition: all 0.15s ease;
        }

        .primary-btn:hover {
            background: #ffffff;
            color: #000000;
        }

        .primary-btn:active {
            transform: translate(2px, 2px);
            box-shadow: 2px 2px 0px #000000;
        }

        .secondary-btn {
            background: #ffffff;
            color: #000000;
            border: var(--border-width) solid var(--border);
            padding: 0.85rem 1.75rem;
            font-size: 0.95rem;
            font-weight: 800;
            text-transform: uppercase;
            cursor: pointer;
            box-shadow: var(--shadow);
            transition: all 0.15s ease;
        }

        .secondary-btn:hover {
            background: #000000;
            color: #ffffff;
        }

        /* Result Cards */
        .res-card {
            background: #ffffff;
            border: var(--border-width) solid var(--border);
            padding: 1.25rem;
            margin-top: 1.5rem;
            box-shadow: var(--shadow);
        }

        .res-title {
            font-size: 1.2rem;
            font-weight: 800;
            text-transform: uppercase;
            margin-bottom: 0.25rem;
        }

        .res-detail {
            font-size: 0.9rem;
            font-weight: 700;
            color: #333333;
            line-height: 1.5;
        }

        /* Qibla Layout */
        .qibla-layout {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 2rem;
            align-items: center;
        }

        /* Compass Visual Brutalism */
        .compass-wrapper {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .compass-dial {
            width: 250px;
            height: 250px;
            border-radius: 50%;
            border: 4px solid #000000;
            background: #ffffff;
            position: relative;
            box-shadow: var(--shadow-lg);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .compass-label {
            position: absolute;
            font-weight: 800;
            font-size: 1.1rem;
        }

        .compass-label.n { top: 10px; color: #000000; }
        .compass-label.e { right: 15px; color: #000000; }
        .compass-label.s { bottom: 10px; color: #000000; }
        .compass-label.w { left: 15px; color: #000000; }

        .needle-north {
            position: absolute;
            width: 4px;
            height: 85px;
            background: #000000;
            transform-origin: center center;
            top: 40px;
        }

        .needle-qibla {
            position: absolute;
            width: 6px;
            height: 105px;
            background: #000000;
            border: 1px solid #ffffff;
            transform-origin: center center;
            transition: transform 0.6s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .kaaba-icon {
            position: absolute;
            font-size: 0.7rem;
            font-weight: 800;
            background: #000000;
            color: #ffffff;
            padding: 2px 4px;
            border: 1px solid #000000;
            transform: translate(-50%, -50%);
            transition: all 0.6s ease;
            white-space: nowrap;
        }

        /* Responsive Media Queries */
        @media (max-width: 768px) {
            .qibla-layout {
                grid-template-columns: 1fr;
                gap: 1.5rem;
            }
        }

        @media (max-width: 600px) {
            body {
                padding: 1rem 0.5rem;
            }

            .header h1 {
                font-size: 1.6rem;
            }

            .header p {
                font-size: 0.8rem;
            }

            .tabs {
                width: 100%;
                overflow-x: auto;
                padding-bottom: 0.5rem;
                gap: 0.4rem;
            }

            .tab-btn {
                padding: 0.5rem 0.85rem;
                font-size: 0.8rem;
            }

            .app-container {
                padding: 1rem;
            }

            .calc-result {
                font-size: 1.8rem;
            }

            .calc-grid {
                gap: 0.4rem;
            }

            .calc-btn {
                padding: 0.85rem 0;
                font-size: 1rem;
            }

            .form-grid-2col {
                grid-template-columns: 1fr;
            }

            .compass-dial {
                width: 210px;
                height: 210px;
            }

            .needle-north {
                height: 70px;
                top: 35px;
            }

            .needle-qibla {
                height: 85px;
            }
        }
    </style>
</head>

<body>

    <div class="header">
        <h1>DESTA CALCULATOR</h1>
        <p>ARITHMETIC • JULIAN DAY • QIBLA DIRECTION</p>
    </div>

    <!-- Navigation Tabs -->
    <div class="tabs">
        <button class="tab-btn active" onclick="switchTab(event, 'calc')">CALCULATOR</button>
        <button class="tab-btn" onclick="switchTab(event, 'julian')">JULIAN DAY</button>
        <button class="tab-btn" onclick="switchTab(event, 'qibla')">QIBLA FINDER</button>
    </div>

    <!-- Main Container -->
    <div class="app-container">

        <!-- TAB 1: CALCULATOR -->
        <div id="tab-calc" class="tab-content active">
            <div class="calc-display">
                <div id="calc-expr" class="calc-expr"></div>
                <div id="calc-result" class="calc-result">0</div>
            </div>

            <div class="calc-grid">
                <button class="calc-btn action" onclick="clearEntry()">C</button>
                <button class="calc-btn action" onclick="clearAll()">AC</button>
                <button class="calc-btn op" onclick="appendChar('(')">(</button>
                <button class="calc-btn op" onclick="appendChar(')')">)</button>
                <button class="calc-btn op" onclick="appendChar('/')">÷</button>

                <button class="calc-btn" onclick="appendChar('7')">7</button>
                <button class="calc-btn" onclick="appendChar('8')">8</button>
                <button class="calc-btn" onclick="appendChar('9')">9</button>
                <button class="calc-btn op" onclick="appendChar('**')">x^y</button>
                <button class="calc-btn op" onclick="appendChar('*')">×</button>

                <button class="calc-btn" onclick="appendChar('4')">4</button>
                <button class="calc-btn" onclick="appendChar('5')">5</button>
                <button class="calc-btn" onclick="appendChar('6')">6</button>
                <button class="calc-btn op" onclick="calcSqrt()">√</button>
                <button class="calc-btn op" onclick="appendChar('-')">-</button>

                <button class="calc-btn" onclick="appendChar('1')">1</button>
                <button class="calc-btn" onclick="appendChar('2')">2</button>
                <button class="calc-btn" onclick="appendChar('3')">3</button>
                <button class="calc-btn op" onclick="appendChar('Math.PI')">π</button>
                <button class="calc-btn op" onclick="appendChar('+')">+</button>

                <button class="calc-btn" onclick="appendChar('0')">0</button>
                <button class="calc-btn" onclick="appendChar('.')">.</button>
                <button class="calc-btn" onclick="negate()">±</button>
                <button class="calc-btn op" onclick="appendChar('Math.E')">e</button>
                <button class="calc-btn equals" onclick="evaluateCalc()">=</button>
            </div>
        </div>

        <!-- TAB 2: JULIAN DAY -->
        <div id="tab-julian" class="tab-content">
            <h2 class="section-title">CALENDAR TO JULIAN DAY (JD)</h2>

            <div class="form-grid">
                <div class="input-group">
                    <label>Year (YYYY)</label>
                    <input type="number" id="jd-year" class="input-control" placeholder="2026">
                </div>
                <div class="input-group">
                    <label>Month (1-12)</label>
                    <input type="number" id="jd-month" class="input-control" min="1" max="12" placeholder="9">
                </div>
                <div class="input-group">
                    <label>Day (1-31)</label>
                    <input type="number" id="jd-day" class="input-control" min="1" max="31" placeholder="16">
                </div>
                <div class="input-group">
                    <label>Time (HH:MM:SS)</label>
                    <input type="time" id="jd-time" class="input-control" step="1">
                </div>
                <div class="input-group">
                    <label>UTC Offset (Hours)</label>
                    <input type="number" id="jd-utc" class="input-control" placeholder="7" value="7">
                </div>
            </div>

            <div style="display: flex; gap: 1rem; margin-top: 1rem; flex-wrap: wrap;">
                <button class="primary-btn" onclick="computeJulianDay()">CALCULATE JULIAN DAY</button>
                <button class="secondary-btn" onclick="setCurrentDateTime()">SET CURRENT TIME</button>
            </div>

            <div class="res-card">
                <div id="jd-result-val" class="res-title">JULIAN DAY (JD): --</div>
                <div id="mjd-result-val" style="font-weight: 700; margin-top: 0.25rem;">MODIFIED JULIAN DAY (MJD): --</div>
                <div id="jd-result-info" class="res-detail" style="margin-top: 0.5rem;">INPUT DATE: --</div>
            </div>
        </div>

        <!-- TAB 3: QIBLA FINDER -->
        <div id="tab-qibla" class="tab-content">
            <h2 class="section-title">QIBLA (KIBLAT) DIRECTION FINDER</h2>

            <div class="qibla-layout">
                <div>
                    <div class="input-group" style="margin-bottom: 1.25rem;">
                        <label>QUICK SELECT CITY</label>
                        <select id="city-preset" class="input-control" onchange="onCitySelected()">
                            <option value="-6.2088,106.8456">Jakarta, Indonesia</option>
                            <option value="-7.2575,112.7521">Surabaya, Indonesia</option>
                            <option value="-6.9175,107.6191">Bandung, Indonesia</option>
                            <option value="3.5952,98.6722">Medan, Indonesia</option>
                            <option value="-5.1477,119.4327">Makassar, Indonesia</option>
                            <option value="3.1390,101.6869">Kuala Lumpur, Malaysia</option>
                            <option value="24.7136,46.6753">Riyadh, Saudi Arabia</option>
                            <option value="51.5074,-0.1278">London, United Kingdom</option>
                            <option value="40.7128,-74.0060">New York, USA</option>
                            <option value="35.6762,139.6503">Tokyo, Japan</option>
                            <option value="-33.8688,151.2093">Sydney, Australia</option>
                        </select>
                    </div>

                    <div class="form-grid-2col">
                        <div class="input-group">
                            <label>LATITUDE (°N/°S)</label>
                            <input type="number" step="any" id="qibla-lat" class="input-control" placeholder="-6.2088">
                        </div>
                        <div class="input-group">
                            <label>LONGITUDE (°E/°W)</label>
                            <input type="number" step="any" id="qibla-lon" class="input-control" placeholder="106.8456">
                        </div>
                    </div>

                    <button class="primary-btn" style="width: 100%; margin-top: 1rem;" onclick="computeQibla()">CALCULATE QIBLA DIRECTION</button>

                    <div class="res-card">
                        <div id="qibla-bearing" class="res-title">BEARING: --°</div>
                        <div id="qibla-dir" style="font-weight: 700;">DIRECTION: --</div>
                        <div id="qibla-dist" class="res-detail" style="margin-top: 0.25rem;">DISTANCE TO MECCA: -- km</div>
                    </div>
                </div>

                <!-- Compass Visual -->
                <div class="compass-wrapper">
                    <div class="compass-dial">
                        <div class="compass-label n">N</div>
                        <div class="compass-label e">E</div>
                        <div class="compass-label s">S</div>
                        <div class="compass-label w">W</div>

                        <div class="needle-north"></div>
                        <div id="needle-qibla" class="needle-qibla"></div>
                        <div id="kaaba-marker" class="kaaba-icon">MECCA</div>
                    </div>
                    <p style="margin-top: 1rem; font-size: 0.85rem; font-weight: 700; text-transform: uppercase;" id="compass-caption">QIBLA VECTOR</p>
                </div>
            </div>
        </div>

    </div>

    <script>
        // Tab switching
        function switchTab(evt, tabId) {
            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
            document.querySelectorAll('.tab-content').forEach(content => content.classList.remove('active'));

            if (evt && evt.currentTarget) {
                evt.currentTarget.classList.add('active');
            }
            document.getElementById('tab-' + tabId).classList.add('active');
        }

        // --- CALCULATOR ---
        let calcExpr = "";

        function appendChar(char) {
            calcExpr += char;
            document.getElementById('calc-expr').innerText = calcExpr;
        }

        function clearAll() {
            calcExpr = "";
            document.getElementById('calc-expr').innerText = "";
            document.getElementById('calc-result').innerText = "0";
        }

        function clearEntry() {
            calcExpr = calcExpr.slice(0, -1);
            document.getElementById('calc-expr').innerText = calcExpr;
        }

        function negate() {
            if (calcExpr.startsWith("-")) {
                calcExpr = calcExpr.substring(1);
            } else {
                calcExpr = "-" + calcExpr;
            }
            document.getElementById('calc-expr').innerText = calcExpr;
        }

        function calcSqrt() {
            try {
                let res = Math.sqrt(eval(calcExpr || document.getElementById('calc-result').innerText));
                document.getElementById('calc-result').innerText = res;
                document.getElementById('calc-expr').innerText = `√(${calcExpr})`;
            } catch (e) {
                document.getElementById('calc-result').innerText = "ERROR";
            }
        }

        function evaluateCalc() {
            try {
                if (!calcExpr) return;
                let res = eval(calcExpr);
                if (typeof res === 'number') {
                    res = Number.isInteger(res) ? res : parseFloat(res.toFixed(8));
                }
                document.getElementById('calc-result').innerText = res;
            } catch (e) {
                document.getElementById('calc-result').innerText = "ERROR";
            }
        }

        // --- JULIAN DAY ---
        function setCurrentDateTime() {
            const now = new Date();
            document.getElementById('jd-year').value = now.getFullYear();
            document.getElementById('jd-month').value = now.getMonth() + 1;
            document.getElementById('jd-day').value = now.getDate();

            const hours = String(now.getHours()).padStart(2, '0');
            const mins = String(now.getMinutes()).padStart(2, '0');
            const secs = String(now.getSeconds()).padStart(2, '0');
            document.getElementById('jd-time').value = `${hours}:${mins}:${secs}`;
            document.getElementById('jd-utc').value = 7;
        }

        function computeJulianDay() {
            const year = parseInt(document.getElementById('jd-year').value) || 2026;
            const month = parseInt(document.getElementById('jd-month').value) || 1;
            const day = parseFloat(document.getElementById('jd-day').value) || 1;
            const timeStr = document.getElementById('jd-time').value || "12:00:00";
            const utcOffset = parseFloat(document.getElementById('jd-utc').value) || 0;

            const timeParts = timeStr.split(':').map(Number);
            const hr = timeParts[0] || 0;
            const mn = timeParts[1] || 0;
            const sc = timeParts[2] || 0;

            const timeInUtc = hr + (mn / 60.0) + (sc / 3600.0) - utcOffset;
            const fracDay = day + (timeInUtc / 24.0);

            let y = year;
            let m = month;
            if (m <= 2) {
                y -= 1;
                m += 12;
            }

            const a = Math.floor(y / 100);
            const b = 2 - a + Math.floor(a / 4);

            const jd = Math.floor(365.25 * (y + 4716)) + Math.floor(30.6001 * (m + 1)) + fracDay + b - 1524.5;
            const mjd = jd - 2400000.5;

            document.getElementById('jd-result-val').innerText = `JULIAN DAY (JD): ${jd.toFixed(6)}`;
            document.getElementById('mjd-result-val').innerText = `MODIFIED JULIAN DAY (MJD): ${mjd.toFixed(6)}`;
            document.getElementById('jd-result-info').innerText = `INPUT DATE: ${year}-${String(month).padStart(2, '0')}-${String(Math.floor(day)).padStart(2, '0')} ${String(hr).padStart(2, '0')}:${String(mn).padStart(2, '0')}:${String(sc).padStart(2, '0')} (UTC${utcOffset >= 0 ? '+' : ''}${utcOffset})`;
        }

        // --- QIBLA FINDER ---
        const MECCA_LAT = 21.422487;
        const MECCA_LON = 39.826206;

        function onCitySelected() {
            const val = document.getElementById('city-preset').value;
            const [lat, lon] = val.split(',').map(Number);
            document.getElementById('qibla-lat').value = lat;
            document.getElementById('qibla-lon').value = lon;
            computeQibla();
        }

        function computeQibla() {
            const lat = parseFloat(document.getElementById('qibla-lat').value);
            const lon = parseFloat(document.getElementById('qibla-lon').value);

            if (isNaN(lat) || isNaN(lon)) return;

            const toRad = deg => deg * Math.PI / 180;
            const toDeg = rad => rad * 180 / Math.PI;

            const phiU = toRad(lat);
            const lambdaU = toRad(lon);
            const phiM = toRad(MECCA_LAT);
            const lambdaM = toRad(MECCA_LON);

            const deltaLambda = lambdaM - lambdaU;

            const y = Math.sin(deltaLambda);
            const x = Math.cos(phiU) * Math.tan(phiM) - Math.sin(phiU) * Math.cos(deltaLambda);

            let bearingDeg = (toDeg(Math.atan2(y, x)) + 360) % 360;

            const dphi = phiM - phiU;
            const haversineA = Math.sin(dphi / 2) ** 2 + Math.cos(phiU) * Math.cos(phiM) * Math.sin(deltaLambda / 2) ** 2;
            const distKm = 6371 * 2 * Math.atan2(Math.sqrt(haversineA), Math.sqrt(1 - haversineA));

            const directions = ["N", "NNE", "NE", "ENE", "E", "ESE", "SE", "SSE", "S", "SSW", "SW", "WSW", "W", "WNW", "NW", "NNW"];
            const dirIdx = Math.round((bearingDeg + 11.25) / 22.5) % 16;

            document.getElementById('qibla-bearing').innerText = `BEARING: ${bearingDeg.toFixed(2)}°`;
            document.getElementById('qibla-dir').innerText = `DIRECTION: ${directions[dirIdx]} (FROM TRUE NORTH)`;
            document.getElementById('qibla-dist').innerText = `DISTANCE TO MECCA: ${distKm.toLocaleString(undefined, { maximumFractionDigits: 2 })} KM`;

            const needle = document.getElementById('needle-qibla');
            needle.style.transform = `rotate(${bearingDeg}deg)`;

            const dial = document.querySelector('.compass-dial');
            const center = dial ? (dial.clientWidth / 2) : 125;
            const radius = center - 25;
            const rad = toRad(bearingDeg - 90);
            const kx = center + radius * Math.cos(rad);
            const ky = center + radius * Math.sin(rad);

            const kaaba = document.getElementById('kaaba-marker');
            kaaba.style.left = `${kx}px`;
            kaaba.style.top = `${ky}px`;

            document.getElementById('compass-caption').innerText = `QIBLA VECTOR: ${bearingDeg.toFixed(1)}° (${directions[dirIdx]})`;
        }

        // Initialize defaults
        setCurrentDateTime();
        computeJulianDay();
        onCitySelected();
    </script>
</body>

</html>
